<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | AyaPDF</title>

    <meta name="description"
          content="Contact AyaSoft about AyaPDF.">

    <link rel="icon" href="images/logo.png">

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/contact.css">

</head>

<body>

<header id="header"></header>

<main>

<section class="page-hero">

    <div class="container">

        <h1>Contact AyaSoft</h1>

        <p>

            We'd love to hear from you.

        </p>

    </div>

</section>

<section>

    <div class="container">

        <div class="contact-grid">

            <div class="card">

                <h2>Email</h2>

                <p>

                    For support, suggestions or bug reports.

                </p>

                <a href="mailto:info@ayasoft.es">

                    info@ayasoft.es

                </a>

            </div>

            <div class="card">

                <h2>Website</h2>

                <p>

                    Visit the official AyaSoft website.

                </p>

                <a href="https://ayasoft.es"
                   target="_blank">

                    ayasoft.es

                </a>

            </div>

            <div class="card">

                <h2>Facebook</h2>

                <p>

                    Follow AyaSoft for updates.

                </p>

                <a href="https://facebook.com/AyaSoftES"
                   target="_blank">

                    facebook.com/AyaSoftES

                </a>

            </div>

        </div>

    </div>

</section>

</main>

<footer id="footer"></footer>

<script src="js/include.js"></script>
<script src="js/main.js"></script>
